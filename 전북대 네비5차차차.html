        let option = document.createElement('option');
        option.value = index;
        option.text = b.건물명;
        selectBox.appendChild(option);
    });

    var mapContainer = document.getElementById('map');
    var mapOption = { center: new kakao.maps.LatLng(35.8467, 127.1290), level: 4 };
    var map = new kakao.maps.Map(mapContainer, mapOption);

    var currentPolyline = null;
    var destMarker = null;
    var myMarker = null;
    var myLat = null;
    var myLng = null;
    var isFirstLocation = true;

    // 실시간 GPS 추적
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(position) {
            myLat = position.coords.latitude;
            myLng = position.coords.longitude;
            var newPos = new kakao.maps.LatLng(myLat, myLng);

            if (myMarker) {
                myMarker.setPosition(newPos);
            } else {
                myMarker = new kakao.maps.Marker({ position: newPos, map: map, title: "내 위치" });
            }

            if (isFirstLocation) {
                map.setCenter(newPos);
                isFirstLocation = false;
            }
        }, function(error) {
            console.error("GPS 위치 에러:", error);
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    // 길찾기 로직 (Tmap 도보 1안 -> 실패 시 직선 2안)
    function calculateRoute() {
        if (myLat === null) {
            alert("현재 위치를 아직 찾고 있습니다. GPS를 허용했는지 확인해 주세요.");
            return;
        }

        let selectedIndex = selectBox.value;
        if (selectedIndex === "") {
            alert("도착할 건물을 먼저 선택해 주세요.");
            return;
        }

        let dest = buildings[selectedIndex]; 

        // 기존 마커와 선 지우기
        if (currentPolyline) currentPolyline.setMap(null);
        if (destMarker) destMarker.setMap(null);

        // 도착지 마커 생성
        destMarker = new kakao.maps.Marker({
            position: new kakao.maps.LatLng(dest.위도, dest.경도),
            map: map,
            title: dest.건물명
        });

        // Tmap API 키가 없으면 바로 2안(직선거리) 실행
        if(!TMAP_API_KEY || TMAP_API_KEY === '여기에_TMAP_API_키_입력') {
            drawStraightLine(dest);
            return;
        }

        // 1안: Tmap 도보 경로 API 호출
        fetch("https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json", {
            method: "POST",
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "appKey": TMAP_API_KEY
            },
            body: JSON.stringify({
                startX: myLng,
                startY: myLat,
                endX: dest.경도,
                endY: dest.위도,
                reqCoordType: "WGS84GEO",
                resCoordType: "WGS84GEO",
                startName: "출발지",
                endName: "도착지"
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.error) {
                console.warn("Tmap 에러 발생. 2안(직선거리)으로 대체합니다.", data.error);
                drawStraightLine(dest);
                return;
            }

            // Tmap 데이터에서 거리/시간 추출
            let distanceMeters = data.features[0].properties.totalDistance;
            let timeMinutes = Math.ceil(data.features[0].properties.totalTime / 60);
            
            showInfoBox(`🏁 [${dest.건물명}]까지 도보 최적 경로<br>거리: <strong>${distanceMeters}m</strong> (약 ${timeMinutes}분)`);

            // 선 긋기
            let linePath = [];
            data.features.forEach(feature => {
                if(feature.geometry.type === "LineString") {
                    feature.geometry.coordinates.forEach(coord => {
                        // Tmap은 [경도, 위도] 순서로 반환하므로 카카오맵 기준(위도, 경도)으로 뒤집어줌
                        linePath.push(new kakao.maps.LatLng(coord[1], coord[0]));
                    });
                }
            });

            drawPolylineAndZoom(linePath, dest);
        })
        .catch(error => {
            console.error("통신 에러 발생. 2안(직선거리)으로 대체합니다.", error);
            drawStraightLine(dest);
        });
    }

    // 2안: 직선 거리 계산 및 그리기 함수 (API 키가 없거나 에러 났을 때 작동)
    function drawStraightLine(dest) {
        let linePath = [
            new kakao.maps.LatLng(myLat, myLng),
            new kakao.maps.LatLng(dest.위도, dest.경도)
        ];
        
        // 임시 폴리라인을 그려서 카카오맵 기능으로 직선거리 계산
        let tempPolyline = new kakao.maps.Polyline({ path: linePath });
        let distanceMeters = Math.round(tempPolyline.getLength());
        // 성인 평균 도보 속도(시속 4km, 분당 67m) 기준 시간 계산
        let timeMinutes = Math.ceil(distanceMeters / 67); 

        showInfoBox(`🏁 [${dest.건물명}]까지 직선 경로 (API 미연동)<br>직선 거리: <strong>${distanceMeters}m</strong> (도보 약 ${timeMinutes}분)`);
        
        drawPolylineAndZoom(linePath, dest);
    }

    // 공통 기능: 정보창 띄우기
    function showInfoBox(htmlContent) {
        let infoBox = document.getElementById('infoBox');
        infoBox.style.display = "block";
        infoBox.innerHTML = htmlContent;
    }

    // 공통 기능: 지도에 선 그리고 출발/도착지 한 화면에 맞추기
    function drawPolylineAndZoom(linePath, dest) {
        currentPolyline = new kakao.maps.Polyline({
            path: linePath,
            strokeWeight: 6,
            strokeColor: '#FF0000',
            strokeOpacity: 0.8,
            strokeStyle: 'solid'
        });
        currentPolyline.setMap(map);

        let bounds = new kakao.maps.LatLngBounds();
        bounds.extend(new kakao.maps.LatLng(myLat, myLng));
        bounds.extend(new kakao.maps.LatLng(dest.위도, dest.경도));
        map.setBounds(bounds);
    }
</script>
</body>
